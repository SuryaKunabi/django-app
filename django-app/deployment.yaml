apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-app-deployment
  labels:
    app: django-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: django-app
  template:
    metadata:
      labels:
        app: django-app
    spec:
      containers:
      - name: django-app 
        image: suryamlv/django-app:latest
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - name: db-connection
            mountPath: /opt
        ports:
        - containerPort: 8000

      volumes: 
        - name: db-connection
          configMap:
           name: test-config